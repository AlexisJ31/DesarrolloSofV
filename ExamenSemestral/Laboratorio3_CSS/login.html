<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DSV</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-acceso pagina-login">
    <main>
        <section>
            <!-- Lado del formulario de inicio de sesión -->
            <div>
                <header>
                    <h1>Iniciar sesión</h1>
                    <p>Accede a tu comunidad académica y profesional</p>
                </header>

                <form action="#" method="POST">
                    <div>
                        <label for="email">Correo electrónico institucional</label>
                        <input type="email" id="email" name="email" placeholder="usuario@universidad.edu" required>
                    </div>

                    <div>
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••••••••••" required>
                    </div>

                    <div class="fila-recordarme">
                        <div>
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Recordarme</label>
                        </div>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div>
                        <button type="submit">Iniciar sesión</button>
                    </div>
                </form>

                <footer>
                    <p>¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
                </footer>
            </div>

            <!-- Lado gráfico / ilustración -->
            <div>
                <div>
                    <!-- Ilustración / Ícono de birrete (logo-mark) -->
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                </div>
                <div>
                    <h2>Tu próximo paso profesional</h2>
                    <p>Conecta con egresados, profesores y empresas de tu misma facultad.</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
